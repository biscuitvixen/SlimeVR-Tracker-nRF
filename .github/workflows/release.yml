name: Build & Release (XIAO + custom overlay)

# Builds the LATEST upstream SlimeVR-Tracker-nRF with this fork's custom
# boards/xiao_ble.overlay layered on top, then publishes the resulting UF2
# as a GitHub Release on this fork.
#
# Strategy: "overwrite-on-build" — we clone pristine upstream `main`, drop our
# overlay file over it, and build. There is never a git merge/rebase here, so
# this can never hit a merge conflict. If upstream changes the board in a way
# that is incompatible with our overlay, the build fails loudly instead.

on:
  schedule:
    # Mondays 06:00 UTC. NOTE: GitHub only runs `schedule` from the repo's
    # DEFAULT branch, which is why this workflow lives on the default branch.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_URL: https://github.com/SlimeVR/SlimeVR-Tracker-nRF.git
  UPSTREAM_BRANCH: main
  ZEPHYR_SDK: "0.17.2"
  BOARD: xiao_ble/nrf52840
  OUT_NAME: SlimeNRF_XIAO_Tracker

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:

      - name: 🧹 Clean landing site
        run: sudo rm -rf zephyr-workspace overlay-src

      - name: 📥 Checkout this branch (overlay source only)
        uses: actions/checkout@v5
        with:
          path: overlay-src

      - name: 🧰 Install dependencies + west
        # Zephyr host build dependencies + the `west` Python tool.
        run: |
          sudo apt-get update && sudo apt install --no-install-recommends -y \
            git cmake ninja-build gperf ccache dfu-util device-tree-compiler \
            wget python3-dev python3-pip python3-setuptools python3-tk \
            python3-wheel python3-venv xz-utils file make gcc gcc-multilib \
            g++-multilib libsdl2-dev libmagic1
          python3 -m venv ~/.venv
          source ~/.venv/bin/activate
          echo "PATH=$PATH" >> $GITHUB_ENV
          pip3 install west ninja

      - name: 🪁 Install Zephyr SDK
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK}/zephyr-sdk-${ZEPHYR_SDK}_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-${ZEPHYR_SDK}_linux-x86_64_minimal.tar.xz -C ~/
          ~/zephyr-sdk-${ZEPHYR_SDK}/setup.sh -c -t arm-zephyr-eabi

      - name: 📂 Clone pristine upstream (${{ env.UPSTREAM_BRANCH }})
        run: |
          mkdir -p zephyr-workspace
          git clone --single-branch --recurse-submodules \
            -b "$UPSTREAM_BRANCH" "$UPSTREAM_URL" zephyr-workspace/SlimeNRF-CI

      - name: 🎨 Apply custom XIAO overlay
        run: |
          cp overlay-src/boards/xiao_ble.overlay \
             zephyr-workspace/SlimeNRF-CI/boards/xiao_ble.overlay
          echo "Overlay applied. Diff vs upstream:"
          git -C zephyr-workspace/SlimeNRF-CI --no-pager diff -- boards/xiao_ble.overlay || true

      - name: 🏷️ Capture upstream version
        id: ver
        run: |
          cd zephyr-workspace/SlimeNRF-CI
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: ♻️ Initialize Zephyr workspace (upstream west.yml)
        run: |
          cd zephyr-workspace
          sudo rm -rf .west
          west init -l SlimeNRF-CI
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: 🐍 Install Python dependencies
        run: |
          cd zephyr-workspace
          pip3 install -r zephyr/scripts/requirements.txt

      - name: 🔨 Build ${{ env.BOARD }}
        run: |
          cd zephyr-workspace
          west build \
            --board "$BOARD" \
            --pristine=always SlimeNRF-CI \
            --build-dir SlimeNRF-CI/build \
            -- \
            -DNCS_TOOLCHAIN_VERSION=NONE \
            -DBOARD_ROOT="$PWD/SlimeNRF-CI"
          mv SlimeNRF-CI/build/SlimeNRF-CI/zephyr/zephyr.uf2 "$OUT_NAME.uf2"
          ls -l "$OUT_NAME.uf2"

      - name: 🚀 Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xiao-${{ steps.ver.outputs.date }}-${{ steps.ver.outputs.sha }}
          name: XIAO Smol Slimes (upstream ${{ steps.ver.outputs.sha }})
          body: |
            Automated firmware build for the custom Seeed XIAO nRF52840 (non-Sense) board.

            - Built from upstream [`SlimeVR/SlimeVR-Tracker-nRF`](${{ env.UPSTREAM_URL }}) `${{ env.UPSTREAM_BRANCH }}` @ `${{ steps.ver.outputs.sha }}`
            - With this fork's custom `boards/xiao_ble.overlay` layered on top (overwrite-on-build)
            - Board target: `${{ env.BOARD }}`

            Flash `${{ env.OUT_NAME }}.uf2` by double-tapping reset and copying it to the `XIAO-SENSE`/`XIAO` mass-storage volume.
          files: zephyr-workspace/${{ env.OUT_NAME }}.uf2
          fail_on_unmatched_files: true
