name: Build & Release (XIAO + custom overlay)

# Builds the LATEST upstream SlimeVR-Tracker-nRF with this fork's custom
# boards/xiao_ble.overlay layered on top, then publishes the resulting UF2
# as a GitHub Release on this fork.
#
# A daily `check` job compares upstream HEAD against the SHA embedded in the
# latest release tag (xiao-<date>-<sha>) and skips the whole build when
# upstream hasn't moved, so releases only appear when there is something new
# to build. A build that fails leaves an `attempted-<sha>` tag behind so the
# same broken upstream commit is not retried every day; the tag is removed
# once a release for a newer commit succeeds. `workflow_dispatch` bypasses
# both checks and always builds.
#
# Strategy: "overwrite-on-build" — we clone pristine upstream `main`, drop our
# overlay file over it, and build. There is never a git merge/rebase here, so
# this can never hit a merge conflict. If upstream changes the board in a way
# that is incompatible with our overlay, the build fails loudly instead.

on:
  schedule:
    # Daily 11:00 UTC - midday UK in summer, 11:00 in winter (cron can't
    # follow DST), so releases land while someone is awake to notice them.
    # The `check` job makes no-change runs cost seconds, so polling daily is
    # cheap. NOTE: GitHub only runs `schedule` from the repo's DEFAULT branch,
    # which is why this workflow lives on the default branch.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_URL: https://github.com/SlimeVR/SlimeVR-Tracker-nRF.git
  UPSTREAM_BRANCH: main
  ZEPHYR_SDK: "0.17.2"
  BOARD: xiao_ble/nrf52840
  OUT_NAME: SlimeNRF_XIAO_Tracker

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.gate.outputs.build }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: 🕵️ Compare upstream HEAD with last release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          SHA=$(git ls-remote "$UPSTREAM_URL" "refs/heads/$UPSTREAM_BRANCH" | cut -c1-7)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          # Latest release tag looks like xiao-<date>-<sha>; the suffix is the
          # upstream SHA that release was built from.
          LAST_TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          LAST_SHA="${LAST_TAG##*-}"

          # A previous run that failed on this exact upstream commit leaves
          # an attempted-<sha> tag; there is no point rebuilding it daily.
          ATTEMPTED=$(gh api "repos/$GH_REPO/git/ref/tags/attempted-$SHA" -q .ref 2>/dev/null || true)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "🔧 Manual run - building regardless of upstream state."
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$SHA" = "$LAST_SHA" ]; then
            echo "✅ Upstream $UPSTREAM_BRANCH still at $SHA (last release: ${LAST_TAG:-none}). Nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$ATTEMPTED" ]; then
            echo "⏭️ Upstream $UPSTREAM_BRANCH at $SHA already failed to build once. Waiting for upstream to move."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "🆕 Upstream moved: $LAST_SHA -> $SHA. Building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🏷️ Mark upstream commit as attempted
        if: steps.gate.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          # The tag points at this fork's own HEAD; the upstream SHA lives in
          # the tag name. Older markers are dropped so only the most recent
          # attempt is ever recorded.
          gh api "repos/$GH_REPO/git/matching-refs/tags/attempted-" -q '.[].ref' \
            | while read -r ref; do
                gh api -X DELETE "repos/$GH_REPO/git/${ref#refs/}" || true
              done
          gh api "repos/$GH_REPO/git/refs" \
            -f ref="refs/tags/attempted-$SHA" -f sha="${{ github.sha }}" >/dev/null
          echo "Marked attempted-$SHA"

  build-release:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:

      - name: 🧹 Clean landing site
        run: sudo rm -rf zephyr-workspace overlay-src

      - name: 📥 Checkout this branch (overlay source only)
        uses: actions/checkout@v5
        with:
          path: overlay-src

      - name: 🧰 Install dependencies + west
        # Zephyr host build dependencies + the `west` Python tool.
        run: |
          sudo apt-get update && sudo apt install --no-install-recommends -y \
            git cmake ninja-build gperf ccache dfu-util device-tree-compiler \
            wget python3-dev python3-pip python3-setuptools python3-tk \
            python3-wheel python3-venv xz-utils file make gcc gcc-multilib \
            g++-multilib libsdl2-dev libmagic1
          python3 -m venv ~/.venv
          source ~/.venv/bin/activate
          echo "PATH=$PATH" >> $GITHUB_ENV
          pip3 install west ninja

      - name: 🪁 Install Zephyr SDK
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK}/zephyr-sdk-${ZEPHYR_SDK}_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-${ZEPHYR_SDK}_linux-x86_64_minimal.tar.xz -C ~/
          ~/zephyr-sdk-${ZEPHYR_SDK}/setup.sh -c -t arm-zephyr-eabi

      - name: 📂 Clone pristine upstream (${{ env.UPSTREAM_BRANCH }})
        run: |
          mkdir -p zephyr-workspace
          git clone --single-branch --recurse-submodules \
            -b "$UPSTREAM_BRANCH" "$UPSTREAM_URL" zephyr-workspace/SlimeNRF-CI

      - name: 🎨 Apply custom XIAO overlay
        run: |
          cp overlay-src/boards/xiao_ble.overlay \
             zephyr-workspace/SlimeNRF-CI/boards/xiao_ble.overlay
          echo "Overlay applied. Diff vs upstream:"
          git -C zephyr-workspace/SlimeNRF-CI --no-pager diff -- boards/xiao_ble.overlay || true

      - name: 🩹 Patch upstream build break (temporary)
        # Upstream PR #159 renamed the IMU ext_passthrough hook to ext_setup
        # with three parameters but left two callers in the direct-mag path
        # untouched, so any board with a `mag` devicetree node fails to
        # compile. The extra arguments are ignored in passthrough mode. Both
        # edits are no-ops once upstream fixes the callers, at which point
        # this step prints nothing and can be deleted.
        run: |
          set -euo pipefail
          F=zephyr-workspace/SlimeNRF-CI/src/sensor/sensor.c
          sed -i \
            -e 's/sensor_imu->ext_passthrough(SENSOR_EXT_MODE_I2C_PASSTHROUGH)/sensor_imu->ext_setup(SENSOR_EXT_MODE_I2C_PASSTHROUGH, NULL, 0)/' \
            -e 's/sensor_imu->ext_setup(SENSOR_EXT_MODE_I2C_PASSTHROUGH, NULL);/sensor_imu->ext_setup(SENSOR_EXT_MODE_I2C_PASSTHROUGH, NULL, 0);/' \
            "$F"
          if git -C zephyr-workspace/SlimeNRF-CI diff --quiet -- src/sensor/sensor.c; then
            echo "::notice::sensor.c patch no longer applies - upstream has fixed it, remove this step."
          else
            git -C zephyr-workspace/SlimeNRF-CI --no-pager diff -- src/sensor/sensor.c
          fi

      - name: 🏷️ Capture upstream version
        id: ver
        run: |
          # Reuse the SHA the check job saw, not a fresh rev-parse: if upstream
          # moves mid-build, the tag should still match what was built.
          echo "sha=${{ needs.check.outputs.sha }}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: ♻️ Initialize Zephyr workspace (upstream west.yml)
        run: |
          cd zephyr-workspace
          sudo rm -rf .west
          west init -l SlimeNRF-CI
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: 🐍 Install Python dependencies
        run: |
          cd zephyr-workspace
          pip3 install -r zephyr/scripts/requirements.txt

      - name: 🔨 Build ${{ env.BOARD }}
        run: |
          cd zephyr-workspace
          west build \
            --board "$BOARD" \
            --pristine=always SlimeNRF-CI \
            --build-dir SlimeNRF-CI/build \
            -- \
            -DNCS_TOOLCHAIN_VERSION=NONE \
            -DBOARD_ROOT="$PWD/SlimeNRF-CI"
          mv SlimeNRF-CI/build/SlimeNRF-CI/zephyr/zephyr.uf2 "$OUT_NAME.uf2"
          ls -l "$OUT_NAME.uf2"

      - name: 🚀 Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xiao-${{ steps.ver.outputs.date }}-${{ steps.ver.outputs.sha }}
          name: XIAO Smol Slimes (upstream ${{ steps.ver.outputs.sha }})
          body: |
            Automated firmware build for the custom Seeed XIAO nRF52840 (non-Sense) board.

            - Built from upstream [`SlimeVR/SlimeVR-Tracker-nRF`](${{ env.UPSTREAM_URL }}) `${{ env.UPSTREAM_BRANCH }}` @ `${{ steps.ver.outputs.sha }}`
            - With this fork's custom `boards/xiao_ble.overlay` layered on top (overwrite-on-build)
            - Board target: `${{ env.BOARD }}`

            Flash `${{ env.OUT_NAME }}.uf2` by double-tapping reset and copying it to the `XIAO-SENSE`/`XIAO` mass-storage volume.
          files: zephyr-workspace/${{ env.OUT_NAME }}.uf2
          fail_on_unmatched_files: true

      - name: 🧽 Drop attempted marker
        # The release now records this upstream SHA, so the marker is
        # redundant; only failed attempts leave one behind.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/attempted-${{ needs.check.outputs.sha }}" || true
